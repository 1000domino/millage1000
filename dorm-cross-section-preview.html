<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>夏の学校｜学生寮断面図プレビュー</title>
  <style>
    :root {
      --ink:#3f3f3f; --paper:#f1f1f1; --wall:#a9a9a9; --room:#dedede;
      --room-dark:#c8c8c8; --orange:#ff5a00; --water:#91ddff;
      --water-edge:#178bd2; --green:#9aa69d; --deep-green:#68756d; --yellow:#ffd400;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; color:var(--ink);
      font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",ui-monospace,monospace;
      background:radial-gradient(circle,rgba(255,90,0,.35) 0 2px,transparent 3px) 0 0/24px 24px,var(--paper);
    }
    .page { width:min(1420px,100%); margin:0 auto; padding:32px 20px 48px; }
    header { display:flex; align-items:end; justify-content:space-between; gap:24px; margin-bottom:18px; }
    h1 { margin:0; font-size:clamp(28px,4vw,54px); font-weight:500; letter-spacing:.08em; }
    header p { margin:6px 0 0; letter-spacing:.16em; opacity:.72; }
    .hint { font-family:sans-serif; font-size:13px; opacity:.7; text-align:right; }
    .section-shell {
      overflow:hidden; border:6px solid var(--orange); background:#ededed;
      box-shadow:12px 12px 0 rgba(255,90,0,.28);
    }
    svg { display:block; width:100%; height:auto; shape-rendering:crispEdges; image-rendering:pixelated; }
    svg * { vector-effect:non-scaling-stroke; }
    .cut-wall { fill:#d5d5d5; stroke:var(--orange); stroke-width:9; }
    .floor-line { stroke:var(--orange); stroke-width:9; }
    .room-fill { fill:var(--room); }
    .room-alt { fill:var(--room-dark); }
    .pixel-line { fill:none; stroke:#8e8e8e; stroke-width:6; }
    .furniture { fill:#858585; }
    .furniture-light { fill:#b6b6b6; }
    .glass { fill:#c7d2d2; stroke:#737f79; stroke-width:6; }
    .water { fill:var(--water); stroke:var(--water-edge); stroke-width:7; }
    .grass { fill:var(--green); stroke:var(--deep-green); stroke-width:6; }
    .floor-tag { fill:var(--orange); }
    .floor-tag-text { fill:#fff; font-size:30px; font-weight:700; text-anchor:middle; }
    .location { cursor:pointer; outline:none; transition:filter .16s ease; }
    .location:hover,.location:focus-visible { filter:brightness(1.04) drop-shadow(8px 8px 0 rgba(255,90,0,.42)); }
    .location:hover .room-hit,.location:focus-visible .room-hit { fill:rgba(255,90,0,.12); stroke:var(--orange); stroke-width:7; }
    .room-hit { fill:transparent; stroke:transparent; stroke-width:7; }
    .room-label {
      pointer-events:none; fill:var(--ink); font-size:20px; font-weight:700;
      paint-order:stroke; stroke:rgba(241,241,241,.98); stroke-width:9; stroke-linejoin:miter;
    }
    .tiny-label { pointer-events:none; fill:#666; font-size:14px; font-weight:700; }
    .info-panel {
      min-height:138px; padding:20px 22px; border-top:6px solid var(--orange);
      background:rgba(248,248,248,.97); box-shadow:inset 0 8px 0 rgba(255,90,0,.14);
    }
    .eyebrow { margin:0 0 6px; font:700 11px/1.2 sans-serif; letter-spacing:.2em; color:var(--orange); }
    .info-panel h2 { margin:0 0 8px; font-size:25px; font-weight:500; }
    .info-panel p { margin:0; line-height:1.8; font-size:14px; }
    @media (max-width:700px) {
      .page { padding:20px 10px 34px; }
      header { align-items:start; flex-direction:column; }
      .hint { text-align:left; }
      .room-label { font-size:27px; }
      .tiny-label { font-size:20px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <h1>学生寮断面図</h1>
        <p>生活のための、もうひとつの校舎</p>
      </div>
      <div class="hint">部屋をクリックすると探索情報が表示されます</div>
    </header>

    <section class="section-shell" aria-label="学生寮断面図">
      <svg viewBox="0 0 1300 940" role="img" aria-labelledby="dorm-title dorm-desc">
        <title id="dorm-title">四階建て学生寮の断面図</title>
        <desc id="dorm-desc">寮室、浴室、洗濯室、購買、食堂、厨房、談話室を横から切り開いて見た図</desc>
        <defs>
          <pattern id="window-grid" width="34" height="26" patternUnits="userSpaceOnUse">
            <rect width="34" height="26" fill="#c7d2d2"/><rect width="5" height="26" fill="#77827d"/>
          </pattern>
          <pattern id="shelf-grid" width="30" height="26" patternUnits="userSpaceOnUse">
            <rect width="30" height="26" fill="#858585"/><rect x="4" y="4" width="22" height="18" fill="#d7d7d7"/>
          </pattern>
          <g id="bed">
            <rect x="0" y="0" width="92" height="26" fill="#f1f1f1" stroke="#858585" stroke-width="6"/>
            <rect x="6" y="5" width="28" height="16" fill="#c7d2d2"/>
            <rect x="4" y="26" width="7" height="18" fill="#858585"/><rect x="81" y="26" width="7" height="18" fill="#858585"/>
          </g>
          <g id="table">
            <rect width="86" height="16" fill="#858585"/><rect x="8" y="16" width="7" height="24" fill="#858585"/><rect x="71" y="16" width="7" height="24" fill="#858585"/>
          </g>
          <g id="sunflower">
            <rect x="-4" y="4" width="8" height="20" fill="#7d887f"/>
            <rect x="-12" y="-8" width="24" height="16" fill="#ffd400"/>
            <rect x="-8" y="-12" width="16" height="24" fill="#ffd400"/>
            <rect x="-4" y="-4" width="8" height="8" fill="#4a4a4a"/>
          </g>
        </defs>

        <rect width="1300" height="860" fill="#e8e8e8"/>
        <rect y="835" width="1300" height="105" fill="#d0d0d0"/>
        <path d="M0 835H1300" stroke="#ff5a00" stroke-width="10"/>

        <!-- 建物と屋根 -->
        <path d="M120 178H1180V828H120Z" class="cut-wall"/>
        <path d="M86 178H1214L1168 116H132Z" fill="#c8c8c8" stroke="#ff5a00" stroke-width="9"/>
        <rect x="100" y="166" width="1100" height="22" fill="#ff5a00"/>

        <!-- 屋上物干し場 -->
        <g class="location" role="button" tabindex="0" data-place="rooftop">
          <path d="M300 92V166 M520 92V166 M300 104H520" class="pixel-line"/>
          <path d="M330 104V138 M382 104V144 M434 104V136 M486 104V146" stroke="#ff5a00" stroke-width="5"/>
          <rect x="318" y="120" width="36" height="20" fill="#ffd400"/>
          <rect x="370" y="126" width="36" height="18" fill="#c7d2d2"/>
          <rect x="422" y="118" width="36" height="18" fill="#9aa69d"/>
          <rect x="474" y="128" width="34" height="18" fill="#dedede"/>
          <rect x="276" y="72" width="270" height="104" class="room-hit"/>
          <text x="330" y="84" class="room-label">物干し場</text>
        </g>

        <!-- 貯水槽 -->
        <g class="location" role="button" tabindex="0" data-place="water-tank">
          <rect x="846" y="82" width="190" height="84" fill="#b6b6b6" stroke="#737f79" stroke-width="7"/>
          <path d="M878 82V166 M910 82V166 M942 82V166 M974 82V166 M1006 82V166" class="pixel-line"/>
          <rect x="826" y="66" width="230" height="110" class="room-hit"/>
          <text x="880" y="130" class="room-label">貯水槽</text>
        </g>

        <!-- 階層線と階表示 -->
        <path d="M120 348H1180 M120 508H1180 M120 668H1180 M120 828H1180" class="floor-line"/>
        <g aria-hidden="true">
          <rect x="62" y="198" width="58" height="130" class="floor-tag"/>
          <rect x="62" y="368" width="58" height="120" class="floor-tag"/>
          <rect x="62" y="528" width="58" height="120" class="floor-tag"/>
          <rect x="62" y="688" width="58" height="120" class="floor-tag"/>
          <text x="91" y="272" class="floor-tag-text">4F</text><text x="91" y="438" class="floor-tag-text">3F</text>
          <text x="91" y="598" class="floor-tag-text">2F</text><text x="91" y="758" class="floor-tag-text">1F</text>
        </g>

        <!-- 中央階段 -->
        <g class="location" role="button" tabindex="0" data-place="stairs">
          <rect x="510" y="188" width="170" height="640" class="room-alt"/>
          <path d="M526 318H555V294H584V270H613V246H642V222H667" class="pixel-line"/>
          <path d="M526 478H555V454H584V430H613V406H642V382H667" class="pixel-line"/>
          <path d="M526 638H555V614H584V590H613V566H642V542H667" class="pixel-line"/>
          <path d="M526 798H555V774H584V750H613V726H642V702H667" class="pixel-line"/>
          <rect x="510" y="188" width="170" height="640" class="room-hit"/>
          <text x="555" y="337" class="tiny-label">階段</text><text x="555" y="497" class="tiny-label">階段</text>
          <text x="555" y="657" class="tiny-label">階段</text><text x="555" y="817" class="tiny-label">階段</text>
        </g>

        <!-- 4F：寮室A -->
        <g class="location" role="button" tabindex="0" data-place="room-401">
          <rect x="130" y="188" width="380" height="160" class="room-fill"/>
          <rect x="152" y="208" width="114" height="42" fill="url(#window-grid)" stroke="#77827d" stroke-width="6"/>
          <use href="#bed" x="166" y="278"/><use href="#table" x="330" y="276"/>
          <rect x="130" y="188" width="380" height="160" class="room-hit"/>
          <text x="156" y="327" class="room-label">寮室 401</text>
        </g>

        <!-- 4F：寮室B -->
        <g class="location" role="button" tabindex="0" data-place="room-402">
          <rect x="680" y="188" width="490" height="160" class="room-fill"/>
          <rect x="704" y="208" width="136" height="42" fill="url(#window-grid)" stroke="#77827d" stroke-width="6"/>
          <use href="#bed" x="720" y="278"/><use href="#bed" x="858" y="278"/><use href="#table" x="1032" y="276"/>
          <rect x="680" y="188" width="490" height="160" class="room-hit"/>
          <text x="1020" y="327" class="room-label">寮室 402</text>
        </g>

        <!-- 3F：寮室 -->
        <g class="location" role="button" tabindex="0" data-place="room-301">
          <rect x="130" y="348" width="380" height="160" class="room-fill"/>
          <rect x="152" y="370" width="114" height="42" fill="url(#window-grid)" stroke="#77827d" stroke-width="6"/>
          <use href="#bed" x="166" y="440"/><use href="#table" x="330" y="438"/>
          <rect x="130" y="348" width="380" height="160" class="room-hit"/>
          <text x="156" y="487" class="room-label">寮室 301</text>
        </g>

        <!-- 3F：談話室 -->
        <g class="location" role="button" tabindex="0" data-place="lounge">
          <rect x="680" y="348" width="490" height="160" class="room-fill"/>
          <rect x="706" y="372" width="170" height="44" class="glass"/>
          <rect x="716" y="448" width="126" height="26" class="furniture"/>
          <rect x="878" y="448" width="126" height="26" class="furniture"/>
          <use href="#table" x="1032" y="430"/>
          <rect x="680" y="348" width="490" height="160" class="room-hit"/>
          <text x="1018" y="487" class="room-label">談話室</text>
        </g>

        <!-- 2F：寮室 -->
        <g class="location" role="button" tabindex="0" data-place="room-201">
          <rect x="130" y="508" width="380" height="160" class="room-fill"/>
          <rect x="152" y="530" width="114" height="42" fill="url(#window-grid)" stroke="#77827d" stroke-width="6"/>
          <use href="#bed" x="166" y="600"/><use href="#table" x="330" y="598"/>
          <rect x="130" y="508" width="380" height="160" class="room-hit"/>
          <text x="156" y="647" class="room-label">寮室 201</text>
        </g>

        <!-- 2F：浴室 -->
        <g class="location" role="button" tabindex="0" data-place="bath">
          <rect x="680" y="508" width="300" height="160" class="room-fill"/>
          <rect x="706" y="548" width="246" height="72" class="water"/>
          <path d="M730 548V620 M778 548V620 M826 548V620 M874 548V620 M922 548V620" stroke="rgba(255,255,255,.8)" stroke-width="5"/>
          <rect x="680" y="508" width="300" height="160" class="room-hit"/>
          <text x="706" y="647" class="room-label">浴室</text>
        </g>

        <!-- 2F：洗濯室 -->
        <g class="location" role="button" tabindex="0" data-place="laundry">
          <rect x="980" y="508" width="190" height="160" class="room-alt"/>
          <rect x="1006" y="542" width="58" height="70" fill="#e4e4e4" stroke="#858585" stroke-width="6"/>
          <rect x="1078" y="542" width="58" height="70" fill="#e4e4e4" stroke="#858585" stroke-width="6"/>
          <rect x="1018" y="556" width="34" height="34" fill="#91ddff"/><rect x="1090" y="556" width="34" height="34" fill="#91ddff"/>
          <rect x="980" y="508" width="190" height="160" class="room-hit"/>
          <text x="1004" y="647" class="room-label">洗濯室</text>
        </g>

        <!-- 1F：購買 -->
        <g class="location" role="button" tabindex="0" data-place="shop">
          <rect x="130" y="668" width="250" height="160" class="room-fill"/>
          <rect x="150" y="694" width="210" height="68" fill="url(#shelf-grid)" stroke="#777" stroke-width="6"/>
          <rect x="172" y="782" width="164" height="18" class="furniture"/>
          <rect x="130" y="668" width="250" height="160" class="room-hit"/>
          <text x="154" y="807" class="room-label">購買</text>
        </g>

        <!-- 1F：玄関・管理人室 -->
        <g class="location" role="button" tabindex="0" data-place="entrance">
          <rect x="380" y="668" width="130" height="160" class="room-alt"/>
          <rect x="400" y="694" width="88" height="134" class="glass"/>
          <rect x="380" y="668" width="130" height="160" class="room-hit"/>
          <text x="397" y="807" class="tiny-label">玄関</text>
        </g>

        <!-- 1F：食堂 -->
        <g class="location" role="button" tabindex="0" data-place="cafeteria">
          <rect x="680" y="668" width="340" height="160" class="room-fill"/>
          <use href="#table" x="706" y="716"/><use href="#table" x="820" y="716"/><use href="#table" x="934" y="716"/>
          <use href="#table" x="706" y="770"/><use href="#table" x="820" y="770"/><use href="#table" x="934" y="770"/>
          <rect x="680" y="668" width="340" height="160" class="room-hit"/>
          <text x="706" y="807" class="room-label">食堂</text>
        </g>

        <!-- 1F：厨房 -->
        <g class="location" role="button" tabindex="0" data-place="kitchen">
          <rect x="1020" y="668" width="150" height="160" class="room-alt"/>
          <rect x="1040" y="698" width="110" height="24" class="furniture"/>
          <rect x="1040" y="750" width="110" height="26" class="furniture-light"/>
          <rect x="1062" y="704" width="24" height="12" fill="#91ddff"/>
          <rect x="1020" y="668" width="150" height="160" class="room-hit"/>
          <text x="1038" y="807" class="room-label">厨房</text>
        </g>

        <!-- 外周の植栽 -->
        <g aria-hidden="true">
          <rect x="28" y="804" width="72" height="31" class="grass"/>
          <rect x="1200" y="796" width="76" height="39" class="grass"/>
          <use href="#sunflower" x="44" y="792"/><use href="#sunflower" x="76" y="796"/>
          <use href="#sunflower" x="1214" y="786"/><use href="#sunflower" x="1248" y="790"/>
        </g>
      </svg>

      <aside class="info-panel" aria-live="polite">
        <p class="eyebrow">EXPLORE</p>
        <h2 id="place-title">学生寮断面図</h2>
        <p id="place-copy">教室を離れても、生活は学校の内側にある。気になる場所を選択してください。</p>
      </aside>
    </section>
  </main>

  <script>
    const places = {
      rooftop:["物干し場","乾いた洗濯物が、風もないのに同じ方向へ揺れている。持ち主のわからない制服が一着混じっている。"],
      "water-tank":["貯水槽","点検口には新しい鍵がかかっている。内側から、水を叩くような音がした。"],
      stairs:["階段","夜になると足音が一人分増える。立ち止まれば、それも同時に止まる。"],
      "room-401":["寮室 401","二人分の部屋に、枕が三つ置かれている。余った一つだけがまだ温かい。"],
      "room-402":["寮室 402","窓から見えるはずの校舎が、今日はいつもより近い。"],
      "room-301":["寮室 301","机の引き出しに、明日の日付で書かれた日記が入っている。"],
      lounge:["談話室","消したはずのテレビが、誰もいない食堂の映像を映している。"],
      "room-201":["寮室 201","壁の向こうから話し声が聞こえる。隣室は、ずっと空室のはずだ。"],
      bath:["浴室","湯船の底に、プールと同じ青い光が揺れている。排水口へは流れていかない。"],
      laundry:["洗濯室","洗濯機の一台だけが回り続けている。中には何も入っていない。"],
      shop:["購買","棚には必要なものが揃っている。代金箱には、使った覚えのない硬貨が入っている。"],
      entrance:["寮玄関","外へ続く扉は壁に塞がれている。靴箱だけが、帰宅を待つように並んでいる。"],
      cafeteria:["食堂","人数分の食事が毎日決まった時刻に並ぶ。誰が作っているのかはわからない。"],
      kitchen:["厨房","調理器具は温かいのに、料理をする者の姿はない。奥の扉は夜だけ開く。"]
    };
    const title=document.querySelector("#place-title");
    const copy=document.querySelector("#place-copy");
    function showPlace(element){const place=places[element.dataset.place];if(!place)return;title.textContent=place[0];copy.textContent=place[1];}
    document.querySelectorAll(".location").forEach((element)=>{
      element.addEventListener("click",()=>showPlace(element));
      element.addEventListener("keydown",(event)=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();showPlace(element);}});
    });
  </script>
</body>
</html>
