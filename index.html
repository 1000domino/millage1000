<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>再び、一千年</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
</head>

<body>

  <!-- ========================================
       HEADER
  ========================================= -->
  <header class="header">

  <!--  <nav>
      <a href="#">ABOUT</a>
      <a href="#">WORLD</a>
      <a href="#">RULE</a>
      <a href="#">CHARACTER</a>
      <a href="#">ARCHIVE</a>
    </nav> -->

    <p class="header-copy">
      あなたは殺した。あなたは憎んでいる。
    </p>

    <div class="window-controls" aria-hidden="true">
      <span>□</span>
      <span>─</span>
      <span>×</span>
    </div>

  </header>


  <!-- ========================================
       MAIN
  ========================================= -->
  <main class="main">

    <!-- 左側：タイトルエリア -->
    <section
      class="title-area"
      aria-label="再び、一千年　リアルタイム進行型創作企画"
    >
    </section>


    <!-- 右側：コンテンツ -->
    <section class="content-area">

      <!-- WARNING -->
      <div class="warning-window">

        <div class="window-title">
          <span>△ WARNING</span>

          <div class="mini-controls" aria-hidden="true">
            <span>─</span>
            <span>□</span>
            <span>×</span>
          </div>
        </div>

        <div class="warning-content">

          <p>
            <span class="gray-marker">
              キャラクターの過去に関する重要な秘匿が存在します。
            </span><br>

            <span class="gray-marker">
              物語の終盤で知ることになります。
            </span>
          </p>

          <p>
            <span class="orange-marker">
              暴力的、非倫理的な表現が含まれます。
            </span>
          </p>

        </div>

      </div>


      <!-- コピー -->
      <div class="story-copy">

        <p>
          <span>愛は苦しいです。</span><br>
          <span>孤独の方がずっと楽です。</span>
        </p>

        <p>
          <span>孤独は愛の失敗じゃない。</span><br>
          <span>愛した後に保存されなければならない。</span><br>
          <span>親愛のまなざしを捧げるよ！</span><br>
          <span>近寄らないで！輪郭を濃くしたいの。</span>
        </p>

        <div class="dotted-line"></div>

        <p>
          <span>あなたは優しいのに。</span><br>
          <span>あなたは優しいから。</span><br>
          <span>理由があったんでしょう？</span>
        </p>

      </div>


      <!-- 派閥入口 -->
      <div class="faction-area">

        <p>
          <span>どちらかをお選びください。</span><br>
        </p>

        <a class="faction-window faction-orange" href="#">
          <div class="faction-titlebar">
            ☆ ☆ ☆
          </div>

          <div class="faction-content">
            <strong>先輩の優しさ</strong>
            <span>→</span>
          </div>
        </a>


        <a class="faction-window faction-gray" href="#">
          <div class="faction-titlebar">
            ☆ ☆ ☆
          </div>

          <div class="faction-content">
            <strong>後輩の罪</strong>
            <span>→</span>
          </div>
        </a>

      </div>


      <!-- 海 -->
      <div class="sea" aria-hidden="true">
        <div class="sea-visual" aria-hidden="true">

  <img
    src="img/3.png"
    class="cumulonimbus pixel-image"
    alt=""
  >

</div>
<!--
        <div class="cloud cloud-01"></div>
        <div class="cloud cloud-02"></div>

        <div class="wave wave-01"></div>
        <div class="wave wave-02"></div>
        <div class="wave wave-03"></div>
      </div>-->

    </section>

  </main>


  <!-- ========================================
       FOOTER
  ========================================= -->
  <footer class="footer">

  <!--  <p class="header-copy">
      あなたは殺した。あなたは憎んでいる。
    </p> -->

    <small>
      © 2026
    </small>

  </footer>

</body>

</html>
