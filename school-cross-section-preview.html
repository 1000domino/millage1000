<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>夏の学校｜校舎断面図プレビュー</title>
  <style>
    :root {
      --ink: #3f3f3f;
      --paper: #f1f1f1;
      --wall: #a9a9a9;
      --room: #dedede;
      --room-dark: #c8c8c8;
      --orange: #ff5a00;
      --water: #91ddff;
      --water-edge: #178bd2;
      --green: #9aa69d;
      --deep-green: #68756d;
      --yellow: #ffd400;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", ui-monospace, monospace;
      background:
        radial-gradient(circle, rgba(255,90,0,.35) 0 2px, transparent 3px) 0 0 / 24px 24px,
        var(--paper);
    }

    .page {
      width: min(1420px, 100%);
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 54px);
      font-weight: 500;
      letter-spacing: .08em;
    }

    header p { margin: 6px 0 0; letter-spacing: .16em; opacity: .72; }
    .hint { font-family: sans-serif; font-size: 13px; opacity: .7; text-align: right; }

    .section-shell {
      position: relative;
      overflow: hidden;
      border: 6px solid var(--orange);
      background: #ededed;
      box-shadow: 12px 12px 0 rgba(255,90,0,.28);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      shape-rendering: crispEdges;
      image-rendering: pixelated;
    }

    svg * { vector-effect: non-scaling-stroke; }

    .cut-wall { fill: #d5d5d5; stroke: var(--orange); stroke-width: 9; }
    .floor-line { stroke: var(--orange); stroke-width: 9; }
    .divider { stroke: #9d9d9d; stroke-width: 7; }
    .room-fill { fill: var(--room); }
    .room-alt { fill: var(--room-dark); }
    .pixel-line { fill: none; stroke: #8e8e8e; stroke-width: 6; }
    .furniture { fill: #858585; }
    .furniture-light { fill: #b6b6b6; }
    .glass { fill: #c7d2d2; stroke: #737f79; stroke-width: 6; }
    .water { fill: var(--water); stroke: var(--water-edge); stroke-width: 8; }
    .water-line { stroke: rgba(255,255,255,.86); stroke-width: 5; }
    .grass { fill: var(--green); stroke: var(--deep-green); stroke-width: 6; }

    .floor-tag { fill: var(--orange); }
    .floor-tag-text {
      fill: #fff;
      font-size: 30px;
      font-weight: 700;
      text-anchor: middle;
    }

    .location {
      cursor: pointer;
      outline: none;
      transition: filter .16s ease;
    }

    .location:hover,
    .location:focus-visible {
      filter: brightness(1.04) drop-shadow(8px 8px 0 rgba(255,90,0,.42));
    }

    .location:hover .room-hit,
    .location:focus-visible .room-hit {
      fill: rgba(255,90,0,.12);
      stroke: var(--orange);
      stroke-width: 7;
    }

    .room-hit { fill: transparent; stroke: transparent; stroke-width: 7; }

    .room-label {
      pointer-events: none;
      fill: var(--ink);
      font-size: 20px;
      font-weight: 700;
      paint-order: stroke;
      stroke: rgba(241,241,241,.98);
      stroke-width: 9px;
      stroke-linejoin: miter;
    }

    .tiny-label {
      pointer-events: none;
      fill: #666;
      font-size: 14px;
      font-weight: 700;
    }

    .info-panel {
      min-height: 138px;
      padding: 20px 22px;
      border-top: 6px solid var(--orange);
      background: rgba(248,248,248,.97);
      box-shadow: inset 0 8px 0 rgba(255,90,0,.14);
    }

    .info-panel .eyebrow {
      margin: 0 0 6px;
      font: 700 11px/1.2 sans-serif;
      letter-spacing: .2em;
      color: var(--orange);
    }

    .info-panel h2 { margin: 0 0 8px; font-size: 25px; font-weight: 500; }
    .info-panel p { margin: 0; line-height: 1.8; font-size: 14px; }

    @media (max-width: 700px) {
      .page { padding: 20px 10px 34px; }
      header { align-items: start; flex-direction: column; }
      .hint { text-align: left; }
      .room-label { font-size: 27px; }
      .tiny-label { font-size: 20px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <h1>校舎断面図</h1>
        <p>横から覗く、夏の学校</p>
      </div>
      <div class="hint">部屋をクリックすると探索情報が表示されます</div>
    </header>

    <section class="section-shell" aria-label="校舎断面図">
      <svg viewBox="0 0 1300 940" role="img" aria-labelledby="section-title section-desc">
        <title id="section-title">四階建て校舎と屋上プールの断面図</title>
        <desc id="section-desc">グラウンド側から校舎の壁を切り開いて見た、教室、特別教室、階段、昇降口、屋上プールの図</desc>

        <defs>
          <pattern id="window-grid" width="34" height="26" patternUnits="userSpaceOnUse">
            <rect width="34" height="26" fill="#c7d2d2"/>
            <rect x="0" y="0" width="5" height="26" fill="#77827d"/>
          </pattern>
          <pattern id="locker-grid" width="24" height="26" patternUnits="userSpaceOnUse">
            <rect width="24" height="26" fill="#b6b6b6"/>
            <rect x="3" y="3" width="18" height="20" fill="#d7d7d7"/>
          </pattern>
          <g id="desk">
            <rect x="0" y="0" width="34" height="12" class="furniture"/>
            <rect x="4" y="12" width="6" height="17" class="furniture"/>
            <rect x="24" y="12" width="6" height="17" class="furniture"/>
          </g>
          <g id="sunflower">
            <rect x="-4" y="4" width="8" height="20" fill="#7d887f"/>
            <rect x="-12" y="-8" width="24" height="16" fill="#ffd400"/>
            <rect x="-8" y="-12" width="16" height="24" fill="#ffd400"/>
            <rect x="-4" y="-4" width="8" height="8" fill="#4a4a4a"/>
          </g>
        </defs>

        <!-- 空と地面 -->
        <rect x="0" y="0" width="1300" height="860" fill="#e8e8e8"/>
        <rect x="0" y="835" width="1300" height="105" fill="#d0d0d0"/>
        <path d="M0 835H1300" stroke="#ff5a00" stroke-width="10"/>

        <!-- 屋上の輪郭 -->
        <path d="M120 178H1180V828H120Z" class="cut-wall"/>
        <rect x="100" y="166" width="1100" height="22" fill="#ff5a00"/>

        <!-- 屋上入口 -->
        <g class="location" role="button" tabindex="0" data-place="rooftop-door">
          <rect x="208" y="86" width="152" height="92" class="room-fill" stroke="#ff5a00" stroke-width="8"/>
          <path d="M192 86H376L352 58H216Z" fill="#bdbdbd" stroke="#ff5a00" stroke-width="8"/>
          <rect x="258" y="112" width="54" height="66" fill="#777"/>
          <rect x="276" y="136" width="8" height="8" fill="#ffd400"/>
          <rect x="192" y="52" width="184" height="132" class="room-hit"/>
          <text x="223" y="106" class="room-label">屋上扉</text>
        </g>

        <!-- 屋上プール -->
        <g class="location" role="button" tabindex="0" data-place="pool">
          <rect x="680" y="88" width="420" height="82" class="water"/>
          <path d="M750 92V166 M820 92V166 M890 92V166 M960 92V166 M1030 92V166" class="water-line"/>
          <path d="M656 112V170 M656 112H688 M656 136H688" fill="none" stroke="#777" stroke-width="7"/>
          <rect x="662" y="70" width="456" height="114" class="room-hit"/>
          <text x="830" y="138" class="room-label">屋上プール</text>
        </g>

        <!-- フェンス -->
        <path d="M430 80V170 M470 80V170 M510 80V170 M1140 80V170" class="pixel-line"/>
        <path d="M414 80H530 M1124 80H1160" class="pixel-line"/>

        <!-- 階層線 -->
        <path d="M120 348H1180 M120 508H1180 M120 668H1180 M120 828H1180" class="floor-line"/>

        <!-- 階表示 -->
        <g aria-hidden="true">
          <rect x="62" y="198" width="58" height="130" class="floor-tag"/>
          <rect x="62" y="368" width="58" height="120" class="floor-tag"/>
          <rect x="62" y="528" width="58" height="120" class="floor-tag"/>
          <rect x="62" y="688" width="58" height="120" class="floor-tag"/>
          <text x="91" y="272" class="floor-tag-text">4F</text>
          <text x="91" y="438" class="floor-tag-text">3F</text>
          <text x="91" y="598" class="floor-tag-text">2F</text>
          <text x="91" y="758" class="floor-tag-text">1F</text>
        </g>

        <!-- 全階をつなぐ階段 -->
        <g class="location" role="button" tabindex="0" data-place="stairs">
          <rect x="460" y="188" width="180" height="640" class="room-alt"/>
          <path d="M477 318H509V294H541V270H573V246H605V222H627" class="pixel-line"/>
          <path d="M477 478H509V454H541V430H573V406H605V382H627" class="pixel-line"/>
          <path d="M477 638H509V614H541V590H573V566H605V542H627" class="pixel-line"/>
          <path d="M477 798H509V774H541V750H573V726H605V702H627" class="pixel-line"/>
          <rect x="460" y="188" width="180" height="640" class="room-hit"/>
          <text x="510" y="337" class="tiny-label">階段</text>
          <text x="510" y="497" class="tiny-label">階段</text>
          <text x="510" y="657" class="tiny-label">階段</text>
          <text x="510" y="817" class="tiny-label">階段</text>
        </g>

        <!-- 4F：教室 -->
        <g class="location" role="button" tabindex="0" data-place="classroom-4">
          <rect x="130" y="188" width="330" height="160" class="room-fill"/>
          <rect x="150" y="206" width="104" height="42" fill="url(#window-grid)" stroke="#77827d" stroke-width="6"/>
          <rect x="286" y="208" width="140" height="40" class="furniture-light"/>
          <use href="#desk" x="178" y="282"/><use href="#desk" x="252" y="282"/><use href="#desk" x="326" y="282"/>
          <rect x="130" y="188" width="330" height="160" class="room-hit"/>
          <text x="158" y="327" class="room-label">教室</text>
        </g>

        <!-- 4F：音楽室 -->
        <g class="location" role="button" tabindex="0" data-place="music-room">
          <rect x="640" y="188" width="290" height="160" class="room-fill"/>
          <rect x="660" y="208" width="122" height="72" class="furniture"/>
          <path d="M674 218V268 M694 218V268 M714 218V268 M734 218V268 M754 218V268" stroke="#dedede" stroke-width="8"/>
          <rect x="812" y="218" width="82" height="52" class="glass"/>
          <rect x="640" y="188" width="290" height="160" class="room-hit"/>
          <text x="662" y="327" class="room-label">音楽室</text>
        </g>

        <!-- 4F：音楽準備室 -->
        <g class="location" role="button" tabindex="0" data-place="music-prep">
          <rect x="930" y="188" width="120" height="160" class="room-alt"/>
          <rect x="950" y="212" width="80" height="82" class="furniture"/>
          <path d="M958 236H1022 M958 262H1022" stroke="#dedede" stroke-width="6"/>
          <rect x="930" y="188" width="120" height="160" class="room-hit"/>
          <text x="944" y="318" class="tiny-label">音楽</text>
          <text x="944" y="338" class="tiny-label">準備室</text>
        </g>

        <!-- 4F：校長室 -->
        <g class="location" role="button" tabindex="0" data-place="principal-room">
          <rect x="1050" y="188" width="120" height="160" class="room-fill"/>
          <rect x="1070" y="216" width="80" height="42" class="glass"/>
          <rect x="1072" y="286" width="74" height="18" class="furniture"/>
          <rect x="1050" y="188" width="120" height="160" class="room-hit"/>
          <text x="1062" y="327" class="room-label">校長室</text>
        </g>

        <!-- 3F：教室 -->
        <g class="location" role="button" tabindex="0" data-place="classroom-3">
          <rect x="130" y="348" width="330" height="160" class="room-fill"/>
          <rect x="150" y="368" width="104" height="42" fill="url(#window-grid)" stroke="#77827d" stroke-width="6"/>
          <rect x="286" y="370" width="140" height="40" class="furniture-light"/>
          <use href="#desk" x="178" y="442"/><use href="#desk" x="252" y="442"/><use href="#desk" x="326" y="442"/>
          <rect x="130" y="348" width="330" height="160" class="room-hit"/>
          <text x="158" y="487" class="room-label">教室</text>
        </g>

        <!-- 3F：図書室 -->
        <g class="location" role="button" tabindex="0" data-place="library">
          <rect x="640" y="348" width="530" height="160" class="room-fill"/>
          <rect x="666" y="372" width="90" height="96" fill="#858585"/>
          <path d="M674 396H748 M674 420H748 M674 444H748" stroke="#dedede" stroke-width="6"/>
          <rect x="790" y="372" width="90" height="96" fill="#858585"/>
          <path d="M798 396H872 M798 420H872 M798 444H872" stroke="#dedede" stroke-width="6"/>
          <rect x="922" y="376" width="190" height="48" class="glass"/>
          <rect x="928" y="454" width="142" height="14" class="furniture"/>
          <rect x="640" y="348" width="530" height="160" class="room-hit"/>
          <text x="968" y="487" class="room-label">図書室</text>
        </g>

        <!-- 2F：教室 -->
        <g class="location" role="button" tabindex="0" data-place="classroom-2">
          <rect x="130" y="508" width="330" height="160" class="room-fill"/>
          <rect x="150" y="528" width="104" height="42" fill="url(#window-grid)" stroke="#77827d" stroke-width="6"/>
          <rect x="286" y="530" width="140" height="40" class="furniture-light"/>
          <use href="#desk" x="178" y="602"/><use href="#desk" x="252" y="602"/><use href="#desk" x="326" y="602"/>
          <rect x="130" y="508" width="330" height="160" class="room-hit"/>
          <text x="158" y="647" class="room-label">教室</text>
        </g>

        <!-- 2F：家庭科室 -->
        <g class="location" role="button" tabindex="0" data-place="home-economics">
          <rect x="640" y="508" width="310" height="160" class="room-fill"/>
          <rect x="666" y="536" width="112" height="26" class="furniture"/>
          <rect x="808" y="536" width="112" height="26" class="furniture"/>
          <rect x="684" y="590" width="72" height="22" class="furniture-light"/>
          <rect x="826" y="590" width="72" height="22" class="furniture-light"/>
          <rect x="708" y="542" width="18" height="12" fill="#91ddff"/>
          <rect x="850" y="542" width="18" height="12" fill="#91ddff"/>
          <rect x="640" y="508" width="310" height="160" class="room-hit"/>
          <text x="666" y="647" class="room-label">家庭科室</text>
        </g>

        <!-- 2F：放送室 -->
        <g class="location" role="button" tabindex="0" data-place="broadcast-room">
          <rect x="950" y="508" width="220" height="160" class="room-alt"/>
          <rect x="974" y="532" width="172" height="48" class="glass"/>
          <rect x="984" y="610" width="146" height="18" class="furniture"/>
          <rect x="1012" y="590" width="12" height="20" fill="#ff5a00"/>
          <rect x="1050" y="590" width="12" height="20" fill="#ffd400"/>
          <rect x="950" y="508" width="220" height="160" class="room-hit"/>
          <text x="978" y="647" class="room-label">放送室</text>
        </g>

        <!-- 1F：昇降口 -->
        <g class="location" role="button" tabindex="0" data-place="entrance">
          <rect x="130" y="668" width="330" height="160" class="room-fill"/>
          <rect x="150" y="690" width="166" height="96" fill="url(#locker-grid)" stroke="#777" stroke-width="6"/>
          <rect x="350" y="696" width="82" height="132" class="glass"/>
          <rect x="130" y="668" width="330" height="160" class="room-hit"/>
          <text x="158" y="807" class="room-label">昇降口</text>
        </g>

        <!-- 1F：保健室 -->
        <g class="location" role="button" tabindex="0" data-place="infirmary">
          <rect x="640" y="668" width="300" height="160" class="room-fill"/>
          <rect x="668" y="706" width="112" height="52" fill="#f1f1f1" stroke="#858585" stroke-width="6"/>
          <rect x="676" y="714" width="32" height="18" fill="#c7d2d2"/>
          <rect x="814" y="700" width="96" height="24" class="furniture"/>
          <rect x="844" y="724" width="8" height="48" class="furniture"/>
          <rect x="640" y="668" width="300" height="160" class="room-hit"/>
          <text x="668" y="807" class="room-label">保健室</text>
        </g>

        <!-- 1F：職員室 -->
        <g class="location" role="button" tabindex="0" data-place="staff-room">
          <rect x="940" y="668" width="230" height="160" class="room-alt"/>
          <rect x="966" y="694" width="176" height="42" class="glass"/>
          <use href="#desk" x="976" y="762"/><use href="#desk" x="1050" y="762"/>
          <rect x="940" y="668" width="230" height="160" class="room-hit"/>
          <text x="968" y="807" class="room-label">職員室</text>
        </g>

        <!-- 外周の夏草と向日葵 -->
        <g aria-hidden="true">
          <rect x="28" y="804" width="72" height="31" class="grass"/>
          <rect x="1200" y="796" width="76" height="39" class="grass"/>
          <use href="#sunflower" x="44" y="792"/><use href="#sunflower" x="76" y="796"/>
          <use href="#sunflower" x="1214" y="786"/><use href="#sunflower" x="1248" y="790"/>
        </g>
      </svg>

      <aside class="info-panel" aria-live="polite">
        <p class="eyebrow">EXPLORE</p>
        <h2 id="place-title">校舎断面図</h2>
        <p id="place-copy">壁を一枚取り払えば、学校の内部は標本箱のように見える。気になる部屋を選択してください。</p>
      </aside>
    </section>
  </main>

  <script>
    const places = {
      "rooftop-door": ["屋上扉", "内側から鍵がかかっている。錆びた蝶番だけが、風もないのに小さく鳴った。"],
      pool: ["屋上プール", "真夏の日差しの下、水面だけが不自然に冷たい。底には何かが沈んでいるように見える。"],
      "classroom-4": ["教室", "机の数は、生徒の数より一つ多い。最後列の机にだけ、名前がない。"],
      stairs: ["階段", "どの階から数えても、踊り場が一つ多い。振り返ると、元の階へ戻っている。"],
      "music-room": ["音楽室", "蓋の閉じたピアノから、聞き覚えのない校歌が一小節だけ鳴った。"],
      "music-prep": ["音楽準備室", "棚に並ぶ楽器のうち、一つだけケースが空いている。"],
      "principal-room": ["校長室", "机の上に名前のない印章が置かれている。壁の歴代写真は、すべて同じ顔だ。"],
      "classroom-3": ["教室", "黒板の日付は今日になっている。書いた者の姿は、どこにもない。"],
      library: ["図書室", "貸出記録には、まだこの学校へ来ていないはずの生徒の名前が残っている。"],
      "classroom-2": ["教室", "窓際の机に、乾ききっていない水滴の跡が残っている。"],
      "home-economics": ["家庭科室", "流し台は乾いているのに、蛇口から水音だけが聞こえる。"],
      "broadcast-room": ["放送室", "電源の入っていないマイクが、ときどき誰かの呼吸を拾う。"],
      entrance: ["昇降口", "外へ通じる門はない。それでも下駄箱には、全員分の靴が揃っている。"],
      infirmary: ["保健室", "白いカーテンの向こうから、眠っている誰かの呼吸が聞こえる。"],
      "staff-room": ["職員室", "机の上には出席簿が一冊。先生の名前を書く欄だけが、黒く塗り潰されている。"]
    };

    const title = document.querySelector("#place-title");
    const copy = document.querySelector("#place-copy");

    function showPlace(element) {
      const place = places[element.dataset.place];
      if (!place) return;
      title.textContent = place[0];
      copy.textContent = place[1];
    }

    document.querySelectorAll(".location").forEach((element) => {
      element.addEventListener("click", () => showPlace(element));
      element.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          showPlace(element);
        }
      });
    });
  </script>
</body>
</html>
